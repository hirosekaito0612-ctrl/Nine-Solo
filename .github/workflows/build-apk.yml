name: Build Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # リポジトリにはFlutterソースのみ入れているので、android/ をCI上で生成する
      - name: Generate Android platform files
        run: |
          flutter create --platforms android --project-name nine_solo --org com.example .
          rm -f test/widget_test.dart
          git checkout -- .
          # ランチャーに表示されるアプリ名を設定
          sed -i 's/android:label="nine_solo"/android:label="ヤメにゃん"/' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yamenyan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
